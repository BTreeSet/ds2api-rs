[package]
name = "ds2api-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
reqwest-impersonate = { git = "https://github.com/deedy5/reqwest-impersonate.git", version = "0.11.13" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors"] }
wasmtime = "44.0.0"

[patch.crates-io]
h2 = { git = "https://github.com/deedy5/h2.git", branch = "0.3.26-patched" }
hyper = { git = "https://github.com/deedy5/hyper.git", branch = "v0.14.32-patched" }

[patch."https://github.com/cloudflare/boring"]
boring = { git = "https://github.com/cloudflare/boring", tag = "v4.21.2" }
boring-sys = { git = "https://github.com/cloudflare/boring", tag = "v4.21.2" }
tokio-boring = { git = "https://github.com/cloudflare/boring", tag = "v4.21.2" }
hyper-boring = { git = "https://github.com/cloudflare/boring", tag = "v4.21.2" }
